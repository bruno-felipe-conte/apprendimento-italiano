name: CI Pipeline

on:
  push:
    branches: [main, master, 'security/**', 'refactor/**']
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linter Check (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript Strict)
        run: npm run typecheck

      - name: Run Test Suite (Vitest)
        run: npm run test

      - name: Run Storage Stress Benchmark
        run: node scripts/stress-storage.js
